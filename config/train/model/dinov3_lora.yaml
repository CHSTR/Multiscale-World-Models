# DINOv3 vit_small/16 (embed dim 384) + manual LoRA attention, for JEPA.
#
# The DINOv3 backbone outputs 384-d tokens; the projector maps them down to the
# workspace dim `${embed_dim}` (192) used by the predictor/action encoder.
# Only LoRA factors (+ norm + patch_embed) are trainable.
#
# Run with:  model=dinov3_lora   (the default checkpoint below is a local copy of
# the LVD1689M vit_small/16 weights).
_target_: jepa.JEPA

encoder:
  _target_: src.encoders.dinov3_encoder.DinoV3Encoder
  pretrained: true
  # null = portable: usa $DINOV3_CKPT si existe, si no descarga por hub oficial.
  # Override: model.encoder.ckpt_path=/ruta/al/pth
  ckpt_path: null
  img_size: ${img_size}
  in_chans: 3              # RGB. Use 15 for the starlet variants (*_starlet_lora).
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.1
  lora_targets: ["qkv", "proj"]

predictor:
  _target_: module.ARPredictor
  num_frames: ${history_size}
  input_dim: ${embed_dim}
  hidden_dim: ${embed_dim}
  output_dim: ${embed_dim}
  depth: 6
  heads: 16
  mlp_dim: 2048
  dim_head: 64
  dropout: 0.1
  emb_dropout: 0.0

action_encoder:
  _target_: module.Embedder
  input_dim: ???
  emb_dim: ${embed_dim}

# Projector 384 (encoder) -> ${embed_dim} (workspace).
projector:
  _target_: module.MLP
  input_dim: 384
  output_dim: ${embed_dim}
  hidden_dim: 2048
  norm_fn:
    _target_: torch.nn.BatchNorm1d
    _partial_: true

# Predictor head ${embed_dim} -> ${embed_dim}.
pred_proj:
  _target_: module.MLP
  input_dim: ${embed_dim}
  output_dim: ${embed_dim}
  hidden_dim: 2048
  norm_fn:
    _target_: torch.nn.BatchNorm1d
    _partial_: true
