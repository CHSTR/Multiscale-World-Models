defaults:
  - launcher: local
  - solver: cem
  - _self_

world:
  env_name: swm/TwoRoom-v1
  num_envs: ${eval.num_eval}
  max_episode_steps: ??? # make sure it's >= eval_budget

seed: 42
policy: /home/chr/le-wm/dataset/checkpoints/lewm/weights_epoch_10.pt #random # ckpt name or random

dataset:
  stats: ${eval.dataset_name}
  keys_to_cache:
    - action
    - proprio

plan_config:
  horizon: 5
  receding_horizon: 5
  action_block: 5 # frameskip

# evaluation from dataset (replay expert trajectories)
eval:
  num_eval: 50
  goal_offset_steps: 25
  eval_budget: 50
  img_size: 224
  dataset_name: tworoom.h5
  callables:
    # -- set state
    - method: _set_state
      args:
        state:
          value: proprio
    # -- set goal state
    - method: _set_goal_state
      args:
        goal_state:
          value: goal_proprio

output:
  filename: tworoom_results.txt
  tag: null              # nombre de la condición en trazas/jsonl (por defecto se deriva)

# Diagnóstico multiescala (ver EXPERIMENTOS.md)
ablation:
  bands: null    # p. ej. [w1], [c3], [details], [LH1,HL1,HH1] o índices [0]
  mode: zero     # zero | mean | noise

perturb:
  kind: none     # none | blur | noise | downsample | brightness
  strength: 0.0  # sigma (blur), std en [0,1] (noise), factor (downsample), delta (brightness)
  goal: true     # aplicar también a la imagen goal
