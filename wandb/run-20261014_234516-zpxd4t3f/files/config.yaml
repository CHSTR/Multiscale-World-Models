data:
    value:
        dataset:
            frameskip: 5
            keys_to_cache:
                - action
                - observation
            keys_to_load:
                - pixels
                - action
                - observation
            keys_to_merge:
                proprio: proprio
            name: ogbench/cube_single_expert.h5
            num_steps: ${eval:'${num_preds} + ${history_size}'}
embed_dim:
    value: 192
history_size:
    value: 3
img_size:
    value: 224
loader:
    value:
        batch_size: 128
        num_workers: ${num_workers}
        persistent_workers: true
        pin_memory: true
        prefetch_factor: 3
loss:
    value:
        sigreg:
            kwargs:
                knots: 17
                num_proj: 1024
            max_tokens: ${loader.batch_size}
            weight: 0.09
model:
    value:
        _target_: jepa.JEPA
        action_encoder:
            _target_: module.Embedder
            emb_dim: ${embed_dim}
            input_dim: 25
        encoder:
            _target_: wavelet.starlet_encoder.StarletEncoder
            filter: b3
            learnable_weights: true
            levels: 3
            vit:
                _target_: stable_pretraining.backbone.utils.vit_hf
                image_size: ${img_size}
                patch_size: 14
                pretrained: false
                size: tiny
                use_mask_token: false
        pred_proj:
            _target_: module.MLP
            hidden_dim: 2048
            input_dim: ${embed_dim}
            output_dim: ${embed_dim}
        predictor:
            _target_: module.ARPredictor
            depth: 6
            dim_head: 64
            dropout: 0.1
            emb_dropout: 0
            heads: 16
            hidden_dim: ${embed_dim}
            input_dim: ${embed_dim}
            mlp_dim: 2048
            num_frames: ${history_size}
            output_dim: ${embed_dim}
        projector:
            _target_: module.MLP
            hidden_dim: 2048
            input_dim: ${embed_dim}
            norm_fn:
                _partial_: true
                _target_: torch.nn.BatchNorm1d
            output_dim: ${embed_dim}
num_preds:
    value: 1
num_workers:
    value: 6
optimizer:
    value:
        lr: 5e-05
        type: AdamW
        weight_decay: 0.001
output_model_name:
    value: starlet_L3_cube
seed:
    value: 3072
slurm.job_id:
    value: N/A
slurm.task_id:
    value: N/A
subdir:
    value: ${hydra:job.id}
system.working_dir:
    value: /home/chr/Multiscale-World-Models
train_split:
    value: 0.9
trainer:
    value:
        accelerator: gpu
        devices: auto
        gradient_clip_val: 1
        max_epochs: 10
        precision: bf16
wandb:
    value:
        config:
            entity: chstr
            id: ${subdir}
            log_model: false
            name: starlet_L3_cube
            project: lewm
            resume: allow
        enabled: true
