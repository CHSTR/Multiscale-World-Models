# DINOv2 vit_small/14 (embed dim 384) + manual LoRA attention, for JEPA.
#
# STARLET FRONTEND (igual que el modelo original)
# ----------------------------------------------
# `starlet_levels` es un int y manda: el wrapper aplica starlet_conv4d a los
# frames RGB y deriva in_chans = 3*(levels+1) solo (levels=3 => 12 canales).
# Filtro b3 y pesos por nivel aprendibles, como wavelet.starlet_encoder.
_target_: jepa.JEPA

encoder:
  _target_: src.encoders.dinov2_encoder.DinoV2Encoder
  pretrained: true
  ckpt_path: null          # null => download from the HF hub (official vits14)
  img_size: ${img_size}
  starlet_levels: 3        # 3 niveles => in_chans = 3*4 = 12 (derivado solo)
  starlet_filter: b3
  starlet_learnable_weights: true
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.1
  lora_targets: ["qkv", "proj"]

predictor:
  _target_: module.ARPredictor
  num_frames: ${history_size}
  input_dim: ${embed_dim}
  hidden_dim: ${embed_dim}
  output_dim: ${embed_dim}
  depth: 6
  heads: 16
  mlp_dim: 2048
  dim_head: 64
  dropout: 0.1
  emb_dropout: 0.0

action_encoder:
  _target_: module.Embedder
  input_dim: ???
  emb_dim: ${embed_dim}

# Projector 384 (encoder) -> ${embed_dim} (workspace).
projector:
  _target_: module.MLP
  input_dim: 384
  output_dim: ${embed_dim}
  hidden_dim: 2048
  norm_fn:
    _target_: torch.nn.BatchNorm1d
    _partial_: true

# Predictor head ${embed_dim} -> ${embed_dim}.
pred_proj:
  _target_: module.MLP
  input_dim: ${embed_dim}
  output_dim: ${embed_dim}
  hidden_dim: 2048
  norm_fn:
    _target_: torch.nn.BatchNorm1d
    _partial_: true
