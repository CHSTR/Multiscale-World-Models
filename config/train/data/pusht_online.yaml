# PushT con frames renderizados ONLINE por stable-envs.
#
# El dataset NO carga `pixels`: sólo estados + acción. En el forward, train.py
# dibuja los frames en el device del batch (GPU) con `online_render.Pixels`.
#
# Requiere `stable-envs[pusht]` instalado (sin rutas locales hardcodeadas).
# Funciona tanto con `pusht_expert_train.h5` como con un archivo liviano sólo de
# estados (`data.dataset.name=pusht_state.h5`, ~159 MB; ver scripts/make_states_only_h5.py).
# Usar con modelos que consumen batch["pixels"], p. ej. `model=lewm`,
# `model=dinov3_lora` o `model=convnext_ms`.
#
# Run:
#   python train.py data=pusht_online model=convnext_ms +experiment=slow_svreg \
#     output_model_name=cnms_pusht_online_slow_svreg

dataset:
  num_steps: ${eval:'${num_preds} + ${history_size}'}
  frameskip: 5
  name: pusht_expert_train.h5
  keys_to_load:
    - action
    - proprio
    - state
  keys_to_cache:
    - action
    - proprio
    - state

render:
  online: true
  state_column: state
  # Mapeo estado -> State de stable-envs (ejemplo oficial de LeWM/PushT).
  env:
    id: PushT
    kwargs: {}
    leaves:
      - {leaf: current.body.agent.position, columns: [0, 2]}
      - {leaf: current.body.block.position, columns: [2, 4]}
      - {leaf: current.body.block.angle, columns: [4, 5]}
    zero: [current.render_segments, current.render_segment_count]
