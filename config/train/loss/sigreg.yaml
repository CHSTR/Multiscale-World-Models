type: sigreg
sigreg:
  weight: 0.09
  # Sólo aplica a modelos espaciales (emb (B,T,N,D), p.ej. model=dinov3_lora_nca):
  # nº de patch tokens submuestreados por paso. = batch_size mantiene la escala de lambda.
  max_tokens: ${loader.batch_size}
  kwargs:
    knots: 17
    num_proj: 1024
# Sólo modelos espaciales con predictor.gate=true: prior de dinámica dispersa.
gate_l1:
  weight: 0.0
# Sólo si el modelo tiene inverse_dynamics (p.ej. model=dinov3_lora_nca_gate_idm).
idm:
  weight: 1.0
