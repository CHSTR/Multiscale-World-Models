data:
    value:
        dataset:
            frameskip: 5
            keys_to_cache:
                - action
                - proprio
                - state
            keys_to_load:
                - pixels
                - action
                - proprio
                - state
            name: pusht_expert_train.h5
            num_steps: ${eval:'${num_preds} + ${history_size}'}
embed_dim:
    value: 192
history_size:
    value: 3
img_size:
    value: 224
loader:
    value:
        batch_size: 128
        num_workers: ${num_workers}
        persistent_workers: true
        pin_memory: true
        prefetch_factor: 3
loss:
    value:
        sigreg:
            kwargs:
                knots: 17
                num_proj: 1024
            weight: 0.09
model:
    value:
        _target_: jepa.JEPA
        action_encoder:
            _target_: module.Embedder
            emb_dim: ${embed_dim}
            input_dim: 10
        encoder:
            _target_: src.encoders.dinov3_encoder.DinoV3Encoder
            ckpt_path: null
            img_size: ${img_size}
            lora_alpha: 16
            lora_dropout: 0.1
            lora_r: 8
            lora_targets:
                - qkv
                - proj
            pretrained: true
            starlet_filter: b3
            starlet_learnable_weights: true
            starlet_levels: 3
        pred_proj:
            _target_: module.MLP
            hidden_dim: 2048
            input_dim: ${embed_dim}
            norm_fn:
                _partial_: true
                _target_: torch.nn.BatchNorm1d
            output_dim: ${embed_dim}
        predictor:
            _target_: module.ARPredictor
            depth: 6
            dim_head: 64
            dropout: 0.1
            emb_dropout: 0
            heads: 16
            hidden_dim: ${embed_dim}
            input_dim: ${embed_dim}
            mlp_dim: 2048
            num_frames: ${history_size}
            output_dim: ${embed_dim}
        projector:
            _target_: module.MLP
            hidden_dim: 2048
            input_dim: 384
            norm_fn:
                _partial_: true
                _target_: torch.nn.BatchNorm1d
            output_dim: ${embed_dim}
num_preds:
    value: 1
num_workers:
    value: 6
optimizer:
    value:
        lr: 5e-05
        type: AdamW
        weight_decay: 0.001
output_model_name:
    value: dinov3_s_lora_starletL3_pusht
seed:
    value: 3072
slurm.job_id:
    value: N/A
slurm.task_id:
    value: N/A
subdir:
    value: dinov3_s_lora_starletL3_pusht
system.working_dir:
    value: /home/chr/Multiscale-World-Models
train_split:
    value: 0.9
trainer:
    value:
        accelerator: gpu
        devices: auto
        gradient_clip_val: 1
        max_epochs: 10
        precision: bf16
wandb:
    value:
        config:
            entity: chstr
            id: ${subdir}
            log_model: false
            name: ${output_model_name}
            project: lewm
            resume: allow
        enabled: true
