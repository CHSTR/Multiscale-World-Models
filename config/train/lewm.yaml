defaults:
  - _self_
  - launcher: local
  - data: pusht
  - model: lewm

output_model_name: lewm
subdir: ${hydra:job.id}

# Reanudar: ruta absoluta a un last.ckpt (full-restore: optimizer/epoch/RNG).
# Ej: python train.py ... resume_from=/ruta/checkpoints/last.ckpt
resume_from: null

num_workers: 6
train_split: 0.9
seed: 3072
img_size: 224
embed_dim: 192
history_size: 3

trainer:
  max_epochs: 10
  devices: auto
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0

loader:
  batch_size: 128 #192
  num_workers: ${num_workers}
  persistent_workers: True
  prefetch_factor: 3
  pin_memory: True

optimizer:
  type: AdamW
  lr: 5e-5
  weight_decay: 1e-3

num_preds: 1

loss:
  sigreg:
    weight: 0.09
    # Sólo aplica a modelos espaciales (emb (B,T,N,D), p.ej. model=dinov3_lora_nca):
    # nº de patch tokens submuestreados por paso. = batch_size mantiene la escala de lambda.
    max_tokens: ${loader.batch_size}
    kwargs:
      knots: 17
      num_proj: 1024

wandb:
  config:
    entity: le-wm
    project: le-wm
