defaults:
  - launcher: local
  - solver: cem
  - _self_

world:
  env_name: swm/MultiScaleDial-v0
  num_envs: ${eval.num_eval}
  max_episode_steps: ??? # make sure it's >= eval_budget
  levels: [2]            # nivel del dial: override por run, p.ej. world.levels='[3]'
  dial_style: balanced  # o wedge

seed: 42
policy: random # ckpt name or random

dataset:
  stats: ${eval.dataset_name}
  keys_to_cache:
    - action
    - raw_state

plan_config:
  horizon: 5
  receding_horizon: 5
  action_block: 5 # frameskip

# evaluation from dataset (replay expert trajectories)
eval:
  num_eval: 200
  goal_offset_steps: 25
  eval_budget: 50
  img_size: 224
  dataset_name: msdial/msdial_eval_k2_balanced_fine.h5
  callables:
    # -- set state
    - method: _set_state
      args:
        state:
          value: raw_state
    # -- set goal state
    - method: _set_goal_state
      args:
        goal_state:
          value: goal_raw_state

output:
  filename: msdial_results.txt
