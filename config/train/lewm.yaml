defaults:
  - _self_
  - launcher: local
  - data: pusht
  - model: lewm
  # Replay priorizado + red de alucinación H (docs/replay_hnet.md):
  #   replay=uniform_labels | per_is | per_focal | per_shuffled
  - replay: disabled
  - loss: sigreg

output_model_name: lewm
subdir: ${hydra:job.id}

# Reanudar: ruta absoluta a un last.ckpt (full-restore: optimizer/epoch/RNG).
# Ej: python train.py ... resume_from=/ruta/checkpoints/last.ckpt
resume_from: null

num_workers: 6
train_split: 0.9
seed: 3072
img_size: 224
embed_dim: 192
history_size: 3

trainer:
  max_epochs: 10
  devices: auto
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0

loader:
  batch_size: 128 #192
  num_workers: ${num_workers}
  persistent_workers: True
  prefetch_factor: 3
  pin_memory: True

optimizer:
  type: AdamW
  lr: 5e-5
  weight_decay: 1e-3

num_preds: 1

# Diagnóstico de modelos espaciales: fracción de tokens que cuentan como "móviles".
diag:
  moving_frac: 0.1

wandb:
  config:
    entity: le-wm
    project: le-wm
